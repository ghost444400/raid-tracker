
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.wrap { padding: 1rem 0; }
.header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; flex-wrap: wrap; }
.title { font-size: 18px; font-weight: 500; color: var(--text-primary); }
.tab-bar { display: flex; gap: 8px; margin-bottom: 1.25rem; flex-wrap: wrap; }
.tab { padding: 6px 14px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; font-size: 13px; color: var(--text-secondary); cursor: pointer; transition: background 0.15s; }
.tab.active { background: var(--bg-accent); color: var(--text-accent); border-color: var(--border-accent); font-weight: 500; }
.section { display: none; }
.section.active { display: block; }

/* 입력 카드 */
.input-card { background: var(--surface-2); border: 0.5px solid var(--border); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 1.25rem; }
.input-card h3 { font-size: 14px; font-weight: 500; color: var(--text-secondary); margin-bottom: 12px; }
.input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 12px; color: var(--text-muted); }
.field select, .field input { font-size: 13px; padding: 6px 10px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: var(--surface-2); color: var(--text-primary); }
.btn-add { margin-top: 12px; padding: 8px 20px; border-radius: var(--radius); border: 0.5px solid var(--border-accent); background: var(--bg-accent); color: var(--text-accent); font-size: 13px; font-weight: 500; cursor: pointer; }
.btn-add:hover { background: var(--fill-accent); color: var(--on-accent); }

/* 결과 테이블 */
.result-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.result-table th { text-align: left; padding: 8px 10px; font-size: 12px; font-weight: 500; color: var(--text-muted); border-bottom: 0.5px solid var(--border); }
.result-table td { padding: 9px 10px; border-bottom: 0.5px solid var(--border); color: var(--text-primary); vertical-align: middle; }
.result-table tr:last-child td { border-bottom: none; }
.result-table tr:hover td { background: var(--surface-1); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-blue { background: var(--bg-accent); color: var(--text-accent); }
.badge-green { background: var(--bg-success); color: var(--text-success); }
.badge-orange { background: var(--bg-warning); color: var(--text-warning); }
.badge-red { background: var(--bg-danger); color: var(--text-danger); }
.del-btn { padding: 3px 8px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-muted); font-size: 11px; cursor: pointer; }
.del-btn:hover { background: var(--bg-danger); color: var(--text-danger); border-color: var(--border-danger); }
.empty { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 13px; }

/* 달력 */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.cal-nav { padding: 4px 12px; border-radius: var(--radius); border: 0.5px solid var(--border-strong); background: transparent; color: var(--text-secondary); font-size: 13px; cursor: pointer; }
.cal-nav:hover { background: var(--surface-1); }
.cal-month-label { font-size: 15px; font-weight: 500; color: var(--text-primary); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; color: var(--text-muted); padding: 4px 0; font-weight: 500; }
.cal-day { min-height: 64px; border-radius: var(--radius); border: 0.5px solid var(--border); background: var(--surface-2); padding: 4px 6px; }
.cal-day.other-month { background: var(--surface-0); opacity: 0.5; }
.cal-day.today { border-color: var(--border-accent); }
.cal-day-num { font-size: 11px; font-weight: 500; color: var(--text-secondary); margin-bottom: 2px; }
.cal-day.today .cal-day-num { color: var(--text-accent); }
.cal-event { font-size: 10px; padding: 1px 4px; border-radius: 3px; margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal-event.start { background: var(--bg-success); color: var(--text-success); }
.cal-event.mid { background: var(--bg-accent); color: var(--text-accent); }
.cal-event.end { background: var(--bg-danger); color: var(--text-danger); }
</style>

<div class="wrap">
  <div class="header">
    <i class="ti ti-sword" style="font-size:22px; color:var(--text-accent);" aria-hidden="true"></i>
    <span class="title">레이드 젠타임 트래커</span>
  </div>

  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('input')">처치 입력</button>
    <button class="tab" onclick="switchTab('list')">젠타임 목록</button>
    <button class="tab" onclick="switchTab('calendar')">달력 보기</button>
  </div>

  <!-- 입력 탭 -->
  <div id="tab-input" class="section active">
    <div class="input-card">
      <h3>처치 시간 입력</h3>
      <div class="input-grid">
        <div class="field">
          <label>레이드</label>
          <select id="sel-raid">
            <option value="안타라스">안타라스 (Antharas)</option>
            <option value="바이움">바이움 (Baium)</option>
            <option value="바이움사제">바이움사제</option>
            <option value="여왕개미">여왕개미 (Queen Ant)</option>
            <option value="여왕개미사제">여왕개미사제</option>
            <option value="코어">코어 (Core)</option>
            <option value="코어사제">코어사제</option>
            <option value="오르펜">오르펜 (Orfen)</option>
            <option value="오르펜사제">오르펜사제</option>
            <option value="자켄">자켄 (Zaken)</option>
          </select>
        </div>
        <div class="field">
          <label>처치 날짜</label>
          <input type="date" id="inp-date">
        </div>
        <div class="field">
          <label>처치 시간</label>
          <input type="time" id="inp-time">
        </div>
      </div>
      <button class="btn-add" onclick="addKill()"><i class="ti ti-plus" aria-hidden="true"></i> 추가</button>
    </div>

    <div style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:1rem 1.25rem;">
      <h3 style="font-size:14px; font-weight:500; color:var(--text-secondary); margin-bottom:12px;">리스폰 범위 (시간)</h3>
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:8px; font-size:12px;">
        <div style="color:var(--text-muted);">안타라스: <strong style="color:var(--text-primary);">228 ~ 252h</strong></div>
        <div style="color:var(--text-muted);">바이움: <strong style="color:var(--text-primary);">120 ~ 128h</strong></div>
        <div style="color:var(--text-muted);">바이움사제: <strong style="color:var(--text-primary);">30 ~ 34h</strong></div>
        <div style="color:var(--text-muted);">여왕개미: <strong style="color:var(--text-primary);">32 ~ 48h</strong></div>
        <div style="color:var(--text-muted);">여왕개미사제: <strong style="color:var(--text-primary);">30 ~ 34h</strong></div>
        <div style="color:var(--text-muted);">코어: <strong style="color:var(--text-primary);">52 ~ 76h</strong></div>
        <div style="color:var(--text-muted);">코어사제: <strong style="color:var(--text-primary);">30 ~ 34h</strong></div>
        <div style="color:var(--text-muted);">오르펜: <strong style="color:var(--text-primary);">52 ~ 76h</strong></div>
        <div style="color:var(--text-muted);">오르펜사제: <strong style="color:var(--text-primary);">30 ~ 34h</strong></div>
        <div style="color:var(--text-muted);">자켄: <strong style="color:var(--text-primary);">46 ~ 54h</strong></div>
      </div>
    </div>
  </div>

  <!-- 목록 탭 -->
  <div id="tab-list" class="section">
    <div id="list-wrap"></div>
  </div>

  <!-- 달력 탭 -->
  <div id="tab-calendar" class="section">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
      <span class="cal-month-label" id="cal-month-label"></span>
      <button class="cal-nav" onclick="changeMonth(1)"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div style="display:flex; gap:12px; margin-top:12px; flex-wrap:wrap; font-size:11px; color:var(--text-muted);">
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--bg-success);margin-right:4px;"></span>젠 시작</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--bg-accent);margin-right:4px;"></span>젠 진행중</span>
      <span><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--bg-danger);margin-right:4px;"></span>젠 마감</span>
    </div>
  </div>
</div>

<script>
const RAIDS = {
  '안타라스': [228, 252], '바이움': [120, 128], '바이움사제': [30, 34],
  '여왕개미': [32, 48], '여왕개미사제': [30, 34], '코어': [52, 76],
  '코어사제': [30, 34], '오르펜': [52, 76], '오르펜사제': [30, 34], '자켄': [46, 54]
};

let kills = JSON.parse(localStorage.getItem('raid_kills') || '[]');
let calYear, calMonth;

function save() { try { localStorage.setItem('raid_kills', JSON.stringify(kills)); } catch(e) {} }

function pad(n) { return String(n).padStart(2, '0'); }

function fmtDt(d) {
  return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function addKill() {
  const raid = document.getElementById('sel-raid').value;
  const date = document.getElementById('inp-date').value;
  const time = document.getElementById('inp-time').value;
  if (!date || !time) { alert('날짜와 시간을 입력해주세요.'); return; }
  const killDt = new Date(date + 'T' + time);
  const [minH, maxH] = RAIDS[raid];
  const start = new Date(killDt.getTime() + minH * 3600000);
  const end = new Date(killDt.getTime() + maxH * 3600000);
  kills.push({ id: Date.now(), raid, killDt: killDt.toISOString(), start: start.toISOString(), end: end.toISOString() });
  kills.sort((a, b) => new Date(a.start) - new Date(b.start));
  save();
  renderList();
  renderCal();
}

function deleteKill(id) {
  kills = kills.filter(k => k.id !== id);
  save();
  renderList();
  renderCal();
}

function statusBadge(k) {
  const now = Date.now();
  const s = new Date(k.start).getTime();
  const e = new Date(k.end).getTime();
  if (now < s) return '<span class="badge badge-blue">대기중</span>';
  if (now <= e) return '<span class="badge badge-green">젠 중</span>';
  return '<span class="badge badge-red">마감</span>';
}

function renderList() {
  const wrap = document.getElementById('list-wrap');
  if (!kills.length) {
    wrap.innerHTML = '<div class="empty"><i class="ti ti-database-off" style="font-size:24px; display:block; margin-bottom:8px;" aria-hidden="true"></i>입력된 처치 기록이 없습니다.</div>';
    return;
  }
  wrap.innerHTML = `<div style="overflow-x:auto;"><table class="result-table">
    <thead><tr>
      <th>레이드</th><th>처치 시간</th><th>젠 시작</th><th>젠 마감</th><th>상태</th><th></th>
    </tr></thead>
    <tbody>
      ${kills.map(k => `<tr>
        <td><strong>${k.raid}</strong></td>
        <td style="color:var(--text-secondary);">${fmtDt(new Date(k.killDt))}</td>
        <td>${fmtDt(new Date(k.start))}</td>
        <td>${fmtDt(new Date(k.end))}</td>
        <td>${statusBadge(k)}</td>
        <td><button class="del-btn" onclick="deleteKill(${k.id})"><i class="ti ti-trash" aria-hidden="true"></i></button></td>
      </tr>`).join('')}
    </tbody>
  </table></div>`;
}

function renderCal() {
  const label = document.getElementById('cal-month-label');
  const grid = document.getElementById('cal-grid');
  label.textContent = `${calYear}년 ${calMonth+1}월`;

  const dows = ['일','월','화','수','목','금','토'];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const first = new Date(calYear, calMonth, 1);
  const last = new Date(calYear, calMonth+1, 0);
  const startDay = first.getDay();
  const today = new Date();

  for (let i = 0; i < startDay; i++) {
    const d = new Date(calYear, calMonth, -startDay+1+i);
    html += `<div class="cal-day other-month"><div class="cal-day-num">${d.getDate()}</div></div>`;
  }

  for (let d = 1; d <= last.getDate(); d++) {
    const dayStart = new Date(calYear, calMonth, d, 0, 0, 0);
    const dayEnd = new Date(calYear, calMonth, d, 23, 59, 59);
    const isToday = (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear());
    let events = '';
    kills.forEach(k => {
      const s = new Date(k.start);
      const e = new Date(k.end);
      const sDay = new Date(s.getFullYear(), s.getMonth(), s.getDate());
      const eDay = new Date(e.getFullYear(), e.getMonth(), e.getDate());
      const thisDay = new Date(calYear, calMonth, d);
      if (thisDay.getTime() === sDay.getTime()) {
        events += `<div class="cal-event start">${k.raid} 젠시작</div>`;
      } else if (thisDay > sDay && thisDay < eDay) {
        events += `<div class="cal-event mid">${k.raid} 진행</div>`;
      } else if (thisDay.getTime() === eDay.getTime()) {
        events += `<div class="cal-event end">${k.raid} 마감</div>`;
      }
    });
    html += `<div class="cal-day${isToday?' today':''}"><div class="cal-day-num">${d}</div>${events}</div>`;
  }

  grid.innerHTML = html;
}

function changeMonth(dir) {
  calMonth += dir;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCal();
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  event.target.classList.add('active');
  if (name === 'list') renderList();
  if (name === 'calendar') renderCal();
}

const now = new Date();
calYear = now.getFullYear();
calMonth = now.getMonth();
const dateInp = document.getElementById('inp-date');
const timeInp = document.getElementById('inp-time');
dateInp.value = `${calYear}-${pad(calMonth+1)}-${pad(now.getDate())}`;
timeInp.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
renderCal();
</script>
